<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мой чат</title>
<link rel="manifest" href="/static/manifest.json">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, sans-serif; }
  body { background: #0a0a0a; color: #ddd; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

  /* Экран входа */
  #login { display: flex; flex-direction: column; align-items: center; justify-content: center;
           height: 100vh; background: linear-gradient(180deg, #1a0f0f, #0a0a0a); padding: 24px; }
  #login h1 { color: #b33; font-size: 28px; margin-bottom: 8px; letter-spacing: 2px; }
  #login p { color: #666; margin-bottom: 32px; font-size: 14px; }
  #name-input { width: 100%; max-width: 320px; padding: 14px; border-radius: 8px;
                border: 1px solid #333; background: #151515; color: #ddd; font-size: 16px; outline: none; }
  #name-input:focus { border-color: #b33; }
  #enter-btn { width: 100%; max-width: 320px; margin-top: 12px; padding: 14px; border: none;
               border-radius: 8px; background: #8b1a1a; color: #fff; font-size: 16px; cursor: pointer; }
  #enter-btn:hover { background: #a52222; }

  /* Список чатов */
  #chat-list-screen { display: none; height: 100vh; background: #0e0e0e; flex-direction: column; }
  #chat-list-screen header { padding: 16px; background: #151515; border-bottom: 1px solid #222;
                             color: #b33; font-weight: 600; letter-spacing: 1px; }
  .chat-item { display: flex; align-items: center; padding: 16px; cursor: pointer;
               border-bottom: 1px solid #1a1a1a; }
  .chat-item:hover { background: #151515; }
  .chat-item .name { font-weight: 600; color: #ddd; }
  .chat-item .preview { color: #666; font-size: 13px; margin-top: 4px; }

  /* Чат */
  #chat-screen { display: none; flex-direction: column; height: 100vh;
                 background: linear-gradient(180deg, #1a0f0f 0%, #0a0a0a 40%, #0a0a0a 100%); }
  #chat-header { display: flex; align-items: center; padding: 14px; background: rgba(20,10,10,0.95);
                 border-bottom: 1px solid #2a1515; }
  #back-btn { background: none; border: none; color: #b33; font-size: 22px; cursor: pointer;
              margin-right: 12px; padding: 0 8px; }
  #chat-title { font-weight: 600; color: #ddd; }
  #messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 80%; padding: 10px 14px; border-radius: 12px; line-height: 1.4; font-size: 15px; white-space: pre-wrap; }
  .msg.user { align-self: flex-end; background: #1e3a5f; color: #fff; border-bottom-right-radius: 4px; }
  .msg.assistant { align-self: flex-start; background: #1a1a1a; color: #ccc;
                   border-bottom-left-radius: 4px; border: 1px solid #222; }
  .msg.assistant .speaker { color: #b33; font-weight: 600; font-size: 13px; display: block; margin-bottom: 2px; }
  #next-area { padding: 8px 16px; background: #0e0e0e; display: none; }
  #next-btn { width: 100%; padding: 12px; border: none; border-radius: 8px;
              background: #4a1a1a; color: #e88; font-size: 15px; cursor: pointer; }
  #next-btn:hover { background: #5c2020; }
  #input-area { display: flex; padding: 12px; background: #0e0e0e; gap: 8px; border-top: 1px solid #1a1a1a; }
  #input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #2a1515;
           background: #151515; color: #ddd; font-size: 15px; outline: none; }
  #input:focus { border-color: #8b1a1a; }
  #send-btn { padding: 0 20px; border: none; border-radius: 8px; background: #8b1a1a;
              color: #fff; cursor: pointer; font-size: 18px; }
  #send-btn:disabled { opacity: 0.4; }
</style>
</head>
<body>

<div id="login">
  <h1>МОЙ ЧАТ</h1>
  <p>введи своё имя</p>
  <input id="name-input" placeholder="Твоё имя..." maxlength="20">
  <button id="enter-btn">Далее</button>
</div>

<div id="chat-list-screen">
  <header>ИСТОРИИ</header>
  <div id="chat-items"></div>
</div>

<div id="chat-screen">
  <div id="chat-header">
    <button id="back-btn">←</button>
    <span id="chat-title">Мой чат</span>
  </div>
  <div id="messages"></div>
  <div id="next-area"><button id="next-btn"></button></div>
  <div id="input-area">
    <input id="input" placeholder="Написать..." disabled>
    <button id="send-btn" disabled>➤</button>
  </div>
</div>

<script>
let userId = localStorage.getItem('userId') || 'u_' + Math.random().toString(36).slice(2);
localStorage.setItem('userId', userId);
let currentNext = null;

function show(el) { document.querySelectorAll('body > div').forEach(d => d.style.display = 'none'); el.style.display = 'flex'; }

// Вход
document.getElementById('enter-btn').onclick = async () => {
  const name = document.getElementById('name-input').value.trim();
  if (!name) return;
  await fetch('/api/enter', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ user_id: userId, name })
  });
  show(document.getElementById('chat-list-screen'));
  document.getElementById('chat-items').innerHTML =
    '<div class="chat-item" onclick="openChat()"><div><div class="name">Рыжий лес (Мой чат)</div><div class="preview">нажми, чтобы начать...</div></div></div>';
};

// Открыть чат
async function openChat() {
  show(document.getElementById('chat-screen'));
  document.getElementById('messages').innerHTML = '';
  const res = await fetch('/api/story/' + userId);
  const data = await res.json();
  if (data.error) { location.reload(); return; }
  document.getElementById('chat-title').textContent = data.title;
  currentNext = data.next_button;
  data.messages.forEach(m => addMsg(m.role, m.content));
  updateNextBtn();
  document.getElementById('input').disabled = false;
  document.getElementById('send-btn').disabled = false;
}

// Добавить сообщение
function addMsg(role, text) {
  const box = document.getElementById('messages');
  if (role === 'assistant') {
    const lines = text.split('\n').filter(l => l.trim());
    lines.forEach(line => {
      const d = document.createElement('div');
      d.className = 'msg assistant';
      const m = line.match(/^([^:]+):\s*(.*)$/);
      if (m) { d.innerHTML = '<span class="speaker">' + m[1] + '</span>' + m[2]; }
      else { d.textContent = line; }
      box.appendChild(d);
    });
  } else {
    const div = document.createElement('div');
    div.className = 'msg user';
    div.textContent = text;
    box.appendChild(div);
  }
  box.scrollTop = box.scrollHeight;
}

function updateNextBtn() {
  const area = document.getElementById('next-area');
  const btn = document.getElementById('next-btn');
  if (currentNext) { area.style.display = 'block'; btn.textContent = currentNext; }
  else { area.style.display = 'none'; }
}

// Отправка
document.getElementById('send-btn').onclick = send;
document.getElementById('input').addEventListener('keypress', e => { if (e.key === 'Enter') send(); });

async function send() {
  const input = document.getElementById('input');
  const btn = document.getElementById('send-btn');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  btn.disabled = true;
  addMsg('user', text);

  const res = await fetch('/api/send', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ user_id: userId, text })
  });
  const data = await res.json();
  addMsg('assistant', data.reply);
  btn.disabled = false;
}

// Следующая сцена
document.getElementById('next-btn').onclick = async () => {
  document.getElementById('messages').innerHTML = '<div style="color:#666; text-align:center;">Загрузка...</div>';
  const res = await fetch('/api/next', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ user_id: userId })
  });
  const data = await res.json();
  document.getElementById('messages').innerHTML = '';
  document.getElementById('chat-title').textContent = data.title;
  currentNext = data.next_button;
  updateNextBtn();
  if (data.start_message) addMsg('assistant', data.start_message);
};

// Назад в список
document.getElementById('back-btn').onclick = () => show(document.getElementById('chat-list-screen'));

// Автовход
if (localStorage.getItem('userName')) {
  document.getElementById('name-input').value = localStorage.getItem('userName');
}
document.getElementById('name-input').addEventListener('input', e => {
  localStorage.setItem('userName', e.target.value);
});
</script>
</body>
</html>
